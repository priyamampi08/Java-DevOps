name: Terraform-eks-setup using github actions
on:
  workflow_run:
    workflows: ["ci-cd workflow"]
    types:
      - completed

permissions:
   id-token: write
   content: read
env:
  AWS_REGION= ap-south-1

Jobs:
   terraform:
     runs_on: ubuntu-latest

     steps:
      - name: checkout code
        uses: actions/checkout@v4
        